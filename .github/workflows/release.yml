name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.4.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Resolve tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag must look like v1.4.1. Got: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          lfs: true

      - name: Validate project version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $pyproject = Get-Content pyproject.toml -Raw
          if ($pyproject -notmatch "version\s*=\s*`"$version`"") {
            throw "pyproject.toml version does not match $version"
          }

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # Install from the committed lockfile on the same platform as end users.
      # This catches stale or hand-edited wheel URLs before publishing the archive.
      - name: Validate locked environment
        shell: pwsh
        run: |
          uv lock --check
          uv sync --locked --managed-python --python 3.12 --inexact --no-install-package llama-cpp-python

      # checkout 只會取出 git 追蹤的檔案。新模組若忘了 git add，這裡就會 ImportError，
      # 而不是等到使用者下載後才發現程式打不開。也一併確認用語庫這類資料檔真的在包裡。
      - name: Verify the checkout is complete
        shell: pwsh
        run: |
          $missing = @()
          foreach ($f in @(
            "assets/glossary/minecraft_zh_tw.json",
            "assets/glossary/modnames_zh_tw.json",
            "src/modpack_translator/pipeline/apoli_power.py",
            "src/modpack_translator/run_log.py",
            "src/modpack_translator/gui/failed_items_dialog.py",
            "src/modpack_translator/gui/glossary_dialog.py",
            "src/modpack_translator/pipeline/glossary.py",
            "src/modpack_translator/pipeline/guide_md.py",
            "src/modpack_translator/pipeline/citadel_book.py",
            "tests/test_failed_items.py"
          )) {
            if (-not (Test-Path $f)) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            throw "These files are missing from the checkout (forgot to git add?):`n  " + ($missing -join "`n  ")
          }

          $env:PYTHONPATH = "src;."
          $env:QT_QPA_PLATFORM = "offscreen"
          uv run --locked python -c "import modpack_translator.gui.main_window; print('import OK')"
          if ($LASTEXITCODE -ne 0) { throw "The app cannot be imported from a clean checkout." }
          uv run --locked python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed." }

      - name: Build Windows launcher
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_windows_launcher.ps1

      - name: Build release archive
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $dist = "dist"
          $stage = Join-Path $dist "Modpack_Translator-$tag"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $excludeDirs = @(
            ".git", ".github", ".venv", ".runtime", "__pycache__",
            "outputs", "Failed Items", "mods_bak", "quests_bak", "data_bak",
            "data", "logs", "dist", "build", "wheels"
          )
          $excludeFiles = @("*.pyc", "*.pyo", "*.log", ".env", ".env.*")

          Get-ChildItem -Force | ForEach-Object {
            if ($excludeDirs -contains $_.Name) { return }
            if ($_.PSIsContainer) {
              Copy-Item $_.FullName (Join-Path $stage $_.Name) -Recurse -Force
            } else {
              foreach ($pattern in $excludeFiles) {
                if ($_.Name -like $pattern) { return }
              }
              Copy-Item $_.FullName (Join-Path $stage $_.Name) -Force
            }
          }

          $zip = Join-Path $dist "Modpack_Translator-$tag.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Modpack_Translator-$tag.zip" | Set-Content "$zip.sha256" -NoNewline -Encoding ascii

      - name: Read archive hash
        id: hash
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $line = Get-Content "dist/Modpack_Translator-$tag.zip.sha256" -Raw
          "sha256=$($line.Split(' ')[0])" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          append_body: true
          body: |
            ### 檔案校驗

            `Modpack_Translator-${{ steps.version.outputs.tag }}.zip`
            SHA-256：`${{ steps.hash.outputs.sha256 }}`

            ### 防毒軟體誤判說明

            啟動器是一支未經數位簽章的小型執行檔。Windows Defender 等防毒軟體的
            機器學習模型有時會把這類檔案標記為威脅（v1.4.1 曾被誤判為
            `Trojan:Win32/Suschil!rfn`）。這是誤判，不是真的有惡意程式。

            本版已針對誤判成因做了調整：啟動器不再透過 `cmd.exe` 啟動程式，
            並加上了完整的版本與發行者中繼資料。

            若仍被攔截：

            1. 先用上面的 SHA-256 確認下載的檔案沒有被竄改。
            2. 到 Windows 安全性 → 病毒與威脅防護 → 保護歷程記錄，選擇「允許」。
            3. 歡迎把檔案回報給 Microsoft 以便修正誤判：
               https://www.microsoft.com/en-us/wdsi/filesubmission
            4. 若不想用啟動器，可以直接執行 `uv run python main.py`。
          files: |
            dist/Modpack_Translator-${{ steps.version.outputs.tag }}.zip
            dist/Modpack_Translator-${{ steps.version.outputs.tag }}.zip.sha256
